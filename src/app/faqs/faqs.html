<section class="faqs" id="faqs">
    <div class="faqs-image">
        <img src="1214.webp" alt="Close up of a tattoo artist tattooing a client">
    </div>

    <div class="faqs-content">
        <h1>FAQS</h1>

        <div class="faqs-list">
            @for (faq of faqs; track faq.question; let i = $index) {
            <div class="faq-item" [class.open]="openIndex() === i">
                <button type="button" class="faq-question" (click)="toggle(i)" [attr.aria-expanded]="openIndex() === i">
                    <span>{{ faq.question }}</span>
                    <span class="icon" aria-hidden="true"></span>
                </button>
                <div class="faq-answer-wrap">
                    <p class="faq-answer">{{ faq.answer }}</p>
                </div>
            </div>
            }
        </div>

        <a routerLink="/faqs" class="read-more">Read More</a>
    </div>
</section>
